[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "restic-repository-browser"
version = "0.1.0"
description = "Read-only web browser for Restic repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "argon2-cffi==25.1.0",
  "cryptography==49.0.0",
  "fastapi==0.116.1",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "ruff==0.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

